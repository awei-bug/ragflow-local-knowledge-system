apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragflow.envConfigName" . }}
data:
  {{- range $key, $val := .Values.env }}
  {{- if and $val (ne $key "RAGFLOW_DEPLOYMENT_MODE") (ne $key "RAGFLOW_SECRET_KEY") (ne $key "MYSQL_HOST") (ne $key "MYSQL_PORT") (ne $key "MYSQL_USER") (ne $key "MYSQL_PASSWORD") (ne $key "MINIO_HOST") (ne $key "MINIO_PORT") (ne $key "MINIO_PASSWORD") (ne $key "REDIS_HOST") (ne $key "REDIS_PORT") (ne $key "REDIS_PASSWORD") (ne $key "ELASTIC_PASSWORD") (ne $key "OPENSEARCH_PASSWORD") }}
  {{ $key }}: {{ quote $val }}
  {{- end }}
  {{- end }}
  RAGFLOW_DEPLOYMENT_MODE: {{ required "env.RAGFLOW_DEPLOYMENT_MODE is required" .Values.env.RAGFLOW_DEPLOYMENT_MODE | quote }}
  {{- if .Values.redis.enabled }}
  REDIS_HOST: {{ printf "%s-redis.%s.svc" (include "ragflow.fullname" .) .Release.Namespace }}
  REDIS_PORT: "6379"
  {{- else }}
  REDIS_HOST: {{ required "env.REDIS_HOST is required when redis.enabled=false" .Values.env.REDIS_HOST | quote }}
  REDIS_PORT: {{ default "6379" .Values.env.REDIS_PORT | quote }}
  {{- end }}
  {{- if .Values.mysql.enabled }}
  MYSQL_HOST: {{ printf "%s-mysql.%s.svc" (include "ragflow.fullname" .) .Release.Namespace }}
  MYSQL_PORT: "3306"
  {{- else }}
  MYSQL_HOST: {{ required "env.MYSQL_HOST is required when mysql.enabled=false" .Values.env.MYSQL_HOST | quote }}
  MYSQL_PORT: {{ default "3306" .Values.env.MYSQL_PORT | quote }}
  MYSQL_USER: {{ default "root" .Values.env.MYSQL_USER | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  MINIO_HOST: {{ printf "%s-minio.%s.svc" (include "ragflow.fullname" .) .Release.Namespace }}
  MINIO_PORT: "9000"
  {{- else }}
  MINIO_HOST: {{ default "" .Values.env.MINIO_HOST | quote }}
  MINIO_PORT: {{ default "9000" .Values.env.MINIO_PORT | quote }}
  {{- end }}
  {{- if eq .Values.env.DOC_ENGINE "elasticsearch" }}
  ES_HOST: {{ printf "%s-es.%s.svc" (include "ragflow.fullname" .) .Release.Namespace }}
  {{- else if eq .Values.env.DOC_ENGINE "infinity" }}
  INFINITY_HOST: {{ printf "%s-infinity.%s.svc" (include "ragflow.fullname" .) .Release.Namespace }}
  {{- else if eq .Values.env.DOC_ENGINE "opensearch" }}
  OS_HOST: {{ printf "%s-opensearch.%s.svc" (include "ragflow.fullname" .) .Release.Namespace }}
  OS_PORT: "9201"
  {{- else }}
  {{ fail "env.DOC_ENGINE must be either 'elasticsearch', 'opensearch' or 'infinity'" }}
  {{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ragflow.envSecretName" . }}
type: Opaque
stringData:
  RAGFLOW_SECRET_KEY: {{ required "env.RAGFLOW_SECRET_KEY is required when secrets.existingSecret is empty" .Values.env.RAGFLOW_SECRET_KEY | quote }}
  REDIS_PASSWORD: {{ required "env.REDIS_PASSWORD is required" .Values.env.REDIS_PASSWORD | quote }}
  MYSQL_PASSWORD: {{ required "env.MYSQL_PASSWORD is required" .Values.env.MYSQL_PASSWORD | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "env.MYSQL_PASSWORD is required" .Values.env.MYSQL_PASSWORD | quote }}
  MINIO_PASSWORD: {{ required "env.MINIO_PASSWORD is required" .Values.env.MINIO_PASSWORD | quote }}
  MINIO_ROOT_PASSWORD: {{ required "env.MINIO_PASSWORD is required" .Values.env.MINIO_PASSWORD | quote }}
  {{- if eq .Values.env.DOC_ENGINE "elasticsearch" }}
  ELASTIC_PASSWORD: {{ required "env.ELASTIC_PASSWORD is required" .Values.env.ELASTIC_PASSWORD | quote }}
  {{- else if eq .Values.env.DOC_ENGINE "opensearch" }}
  OPENSEARCH_PASSWORD: {{ required "env.OPENSEARCH_PASSWORD is required" .Values.env.OPENSEARCH_PASSWORD | quote }}
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: {{ required "env.OPENSEARCH_PASSWORD is required" .Values.env.OPENSEARCH_PASSWORD | quote }}
  {{- end }}
{{- end }}
